 if(!code){details.innerHTML='<h2>货位详情</h2><p>请选择货位</p>';return;}
 const r=model.records[code]||{state:model.co?'待现场核验':'空位',count:'0'};
 const facts=[['货位号',code],['备货批次号',r.batch||'—'],...(!model.co?[['客户',r.customer||'—']]:[]),[model.co?'袋数':'捆包数',r.count+' '+model.unit],['实物净重',r.net?r.net+' MT':'—'],['状态',r.state]];
 if(model.co)facts.push(['适用钴品位',r.grade||'—'],['预计钴金属量',r.estimated?r.estimated+' MT':'—'],['ARECOMS 确认量',r.confirmed||'—']);
 details.innerHTML='<h2>选中货位详情</h2><dl>'+facts.map(([k,v])=>'<div><dt>'+t(k)+'</dt><dd>'+t(v)+'</dd></div>').join('')+'</dl>';
}
function choose(code){
 const c=model.cells.find(x=>x.code===code);if(!c)return;
 selected=code;for(const g of cells)g.setAttribute('aria-pressed',String(g.dataset.code===code));
 const w=Math.max(model.co?720:450,c.width*1.65),h=Math.max(w*.76,c.height*1.12);
 fit([c.x+c.width/2-w/2,c.y+c.height/2-h/2,w,h]);detailsFor(code);status.textContent='已定位 '+code;
}
for(const g of cells){g.onclick=()=>choose(g.dataset.code);g.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();choose(g.dataset.code);}};}
form.onsubmit=e=>{
 e.preventDefault();const query=form.elements.query.value.trim().toLowerCase();
 const found=query&&(model.cells.find(c=>c.code.toLowerCase()===query)||model.cells.find(c=>[c.code,model.records[c.code]?.batch,model.records[c.code]?.customer,model.records[c.code]?.bag].some(v=>v?.toLowerCase().includes(query))));
 if(found){choose(found.code);if(innerWidth<880)details.scrollIntoView({block:'nearest'});}else status.textContent=query?'未找到匹配货位':'请输入定位条件';
};
document.querySelector('[data-fit]').onclick=()=>fit();
document.querySelector('[data-clear]').onclick=()=>{form.reset();for(const g of cells)g.setAttribute('aria-pressed','false');selected=null;fit();detailsFor(null);status.textContent='已清除定位';};
document.querySelector('[data-refresh]').onclick=()=>{detailsFor(selected);status.textContent='已重新读取方案示例';};
for(const b of document.querySelectorAll('[data-zoom]'))b.onclick=()=>{
 const factor=Number(b.dataset.zoom),w=view[2]*factor,h=view[3]*factor;
 if(w<model.bounds[2]/16)return;
 fit(w>=model.bounds[2]?model.bounds:[view[0]+(view[2]-w)/2,view[1]+(view[3]-h)/2,w,h]);
};
choose(model.initial);</script></body></html>
