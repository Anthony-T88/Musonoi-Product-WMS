body{margin:0;background:var(--base);color:var(--fg);font:15px/1.55 "Microsoft YaHei UI","Segoe UI",sans-serif}
main{max-width:1520px;margin:auto;padding:clamp(14px,3vw,40px)} h1{margin:0;font-size:clamp(24px,3vw,34px)} h2{margin:0 0 12px;font-size:18px} p{margin:8px 0} small,.note{color:var(--muted)}
header{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:baseline;gap:10px}
.panel{background:var(--paper);padding:16px;border:1px solid var(--line);border-radius:10px;min-width:0}
.layout{display:grid;grid-template-columns:minmax(205px,1fr) minmax(0,3fr);gap:16px}.selection{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,.44fr);gap:14px;align-items:start}
.toolbar,.legend{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-block:10px} form{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
button,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:5px;min-height:40px}button{background:white;color:var(--fg);cursor:pointer}.primary{background:var(--green);color:white}
svg{display:block;width:100%;height:min(48vh,510px);min-height:260px;background:var(--base);border:1px solid var(--line);border-radius:6px}.zone{fill:var(--fg);font-size:34px;font-weight:650}
.facility{fill:#e5eee8;stroke:#b6c8bc;stroke-width:2}.road{fill:none;stroke:#b9c8c3;stroke-width:24}

.cell[aria-pressed=true] rect{stroke:var(--green);stroke-width:7}.cell text{pointer-events:none;fill:var(--fg);font-weight:600}.cell[role=button]{cursor:pointer}
