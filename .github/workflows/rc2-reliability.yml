name: Isolated WMS release and Docker acceptance
on:
  pull_request:
    branches: [release/v4.7.2]
  push:
    branches: [release/v4.7.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-acceptance:
    name: WMS TEST and UIUX quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify syntax, source integrity and the migration chain
        run: node tests/release/source-check.cjs
      - name: Check shared UI tokens and scenario inventory
        run: node tests/release/uiux-quality.cjs static
      - name: Generate temporary CI credentials and TLS
        run: node tests/release/ci-setup.cjs
      - name: Start an independent temporary PostgreSQL 16 server
        run: |
          sudo chown 999:999 .runtime/ci-tls/server.key
          docker network create rc2-ci-net
          docker run -d --name rc2-postgres --network rc2-ci-net -p 127.0.0.1:55432:5432 -e POSTGRES_USER=musonoi_owner -e POSTGRES_PASSWORD -v "$PWD/.runtime/ci-tls:/tls:ro" postgres:16 -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          for i in $(seq 1 60); do docker exec rc2-postgres pg_isready -h 127.0.0.1 -U musonoi_owner -d postgres && exit 0; sleep 1; done
          exit 1
      - name: Verify business, required UI matrices and browser workflows
        run: node tests/release/uiux-verify.cjs .runtime/release-tests/uiux/verification
      - name: Actual Docker build, final image inspection and production-mode synthetic startup
        run: node tests/release/docker-acceptance.cjs
      - name: Upload only explicitly approved sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-sanitized-acceptance-evidence
          if-no-files-found: warn
          path: |
            .runtime/release-tests/*results.json
            .runtime/release-tests/runner-*.json
            .runtime/release-tests/docker-image-files.txt
            .runtime/release-tests/stock-*.png
            .runtime/release-tests/permissions-*.png
            .runtime/release-tests/uiux/verification/exits.json
            .runtime/release-tests/uiux/verification/*-results.json
            .runtime/release-tests/uiux/verification/*/coverage.json
            .runtime/release-tests/uiux/verification/*/pixel-results.json
            .runtime/release-tests/uiux/verification/*/failed-*.png
            .runtime/release-tests/uiux/verification/workflows/workflows.json
            .runtime/release-tests/uiux/verification/workflows/filter-390-*.png
            .runtime/release-tests/uiux/verification/workflows/expected-rejection-*.png
      - name: Remove temporary containers and volume
        if: always()
        run: |
          docker rm -f rc2-app rc2-postgres || true
          docker volume rm rc2-ci-uploads || true
          docker network rm rc2-ci-net || true
