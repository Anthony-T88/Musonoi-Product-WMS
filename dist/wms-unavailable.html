<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex">
 <title>仓储服务暂不可用 · Product WMS</title>
 <style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 1rem/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: #23382d; background: #f4f6f4; }
  header { display: flex; align-items: center; gap: .75rem; padding: .75rem 1.25rem; background: #fff; border-bottom: 1px solid #cbd6ce; }
  header small { display: block; color: #52645a; }
  main { min-height: calc(100vh - 4.5rem); display: grid; place-items: center; padding: 1rem; background: radial-gradient(ellipse at top,#e5f1e8,#f4f6f4 75%); }
  section { width: min(100%,36rem); padding: clamp(1.125rem,4vw,2.25rem); border: 1px solid #cbd6ce; border-radius: .5rem; background: #fff; box-shadow: 0 1rem 3rem #12241c33; }
  h1 { margin: .9rem 0 .5rem; font-size: clamp(1.375rem,4vw,1.75rem); line-height: 1.25; }
  p { color: #52645a; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .signal { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: .5rem; background: #f9e6e5; color: #952b29; font-size: 1.5rem; font-weight: 650; }
  code { padding: .25rem .5rem; border: 1px solid #cbd6ce; border-radius: .4rem; color: #52645a; }
  a { display: inline-flex; min-height: 2.75rem; align-items: center; padding: .5rem .875rem; border-radius: .5rem; background: #256447; color: #fff; text-decoration: none; }
  a:focus-visible { outline: 3px solid #235e87; outline-offset: 4px; }
 </style>
</head>
<body>
 <header><div><strong>产品仓储管理系统 · Product WMS</strong><small>穆松尼项目 · Musonoi Project</small></div></header>
 <main><section aria-labelledby="service-title">
  <div class="top"><span class="signal" aria-hidden="true">!</span><code>HTTP 503</code></div>
  <h1 id="service-title">仓储服务暂不可用</h1>
  <p>请稍后重新连接。如问题持续，请记录发生时间并联系系统管理员。</p>
  <p lang="en">WMS is temporarily unavailable. Try again in a moment. If the problem continues, note the time and contact your WMS administrator.</p>
  <a href="./">重新连接 · Reconnect</a>
 </section></main>
</body>
</html>
