services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: musonoi_owner
      POSTGRES_DB: musonoi_production
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
      TZ: Africa/Lubumbashi
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U musonoi_owner -d musonoi_production']
      interval: 10s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?Set DATABASE_OWNER_URL}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      PRODUCTION_BACKUP_VERIFIED: ${PRODUCTION_BACKUP_VERIFIED:-no}
    command: [node, scripts/production-db.cjs]
    depends_on:
      database:
        condition: service_healthy
    profiles: [maintenance]
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set application DATABASE_URL}
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
      PORT: 4174
      HOST: 0.0.0.0
      TZ: Africa/Lubumbashi
      VERIFY_SOURCE_INTEGRITY: '1'
    ports:
      - '127.0.0.1:4174:4174'
    volumes:
      - uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  uploads:
